# =============================================================================
#  Yordamchim BACKEND — mustaqil production to'plami
#
#  O'z-o'zicha yetarli: db + Django(gunicorn) + Caddy(avto-HTTPS).
#  Frontend'dan MUTLAQO mustaqil deploy bo'ladi.
#
#    db      : PostgreSQL 16 (faqat ichki tarmoq)
#    backend : Django + gunicorn (ichki :8000)
#    caddy   : 80/443 -> api.yordamchim.uz uchun TLS + reverse proxy
#
#  Ishga tushirish (backend papkasidan):
#    docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
#  Media (slayd rasmlari) tashqi S3-mos storage'da (.env.prod dagi AWS_*).
# =============================================================================

name: yordamchim-backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yordamchim}
      POSTGRES_USER: ${POSTGRES_USER:-yordamchim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod da POSTGRES_PASSWORD majburiy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yordamchim} -d ${POSTGRES_DB:-yordamchim}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
    image: yordamchim-backend:prod
    restart: unless-stopped
    # DJANGO_*, DATABASE_URL, GEMINI_*, AWS_*, TELEGRAM_* — hammasi shu faylda.
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/admin/login/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # Let's Encrypt sertifikatlari — persist
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
